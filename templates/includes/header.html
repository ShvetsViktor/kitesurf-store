{% load static %}
<nav class="navbar navbar-expand-sm bg-white border-bottom" aria-label="Main navigation">
    <div class="container">
        <a
            class="navbar-brand"
            href="{% url 'home' %}"
            aria-label="KiteSurf Store homepage"
        >
            <img
                src="{% static 'images/logo.webp' %}"
                alt="KiteSurf Store"
                class="brand-logo d-none d-sm-block"
            >
            <img
                src="{% static 'images/logo-compact.webp' %}"
                alt=""
                class="brand-logo-compact d-sm-none"
            >
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="{% url 'product_list' %}">
                                            Products
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a
                        class="nav-link d-inline-flex align-items-center gap-2"
                        href="{% url 'bag_detail' %}"
                        aria-label="Shopping bag"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="22"
                            height="22"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M6 7h15l-1.5 9h-12L6 7Z"/>
                            <path d="M6 7 5 4H2"/>
                            <circle cx="9" cy="20" r="1"/>
                            <circle cx="18" cy="20" r="1"/>
                        </svg>

                        <span>Shopping Bag</span>

                        <span
                            id="bag-count"
                            class="badge rounded-pill bg-primary"
                        >
                            {{ bag_count }}
                        </span>
                    </a>
                </li>
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'account_logout' %}">
                            Log Out
                        </a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'account_login' %}">
                            Log In
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'account_signup' %}">
                            Sign Up
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
