{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>{% block title %}KiteSurf Store{% endblock %}</title>

    <meta
        name="description"
        content="{% block meta_description %}Explore kitesurfing equipment, including kites, boards and accessories at KiteSurf Store.{% endblock %}"
    >

    <!-- Prevent indexing of this educational project -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Browser theme -->
    <meta name="theme-color" content="#007f86">

    <!-- Bootstrap 5.3 includes Reboot -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Project-specific styles -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    {% include 'includes/header.html' %}

    <main id="main-content" class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
